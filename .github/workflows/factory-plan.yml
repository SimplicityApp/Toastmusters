# Factory station "plan" in the cloud. Runs when a factory actor promotes an issue
# (factory:ready) and when a factory PR closes (a WIP slot frees up), then plans the oldest
# ready issue if the WIP limit allows. See .factory/README.md.
#
# Inert until: repository variable FACTORY_ENABLED = true, the Claude GitHub App is installed
# (github.com/apps/claude; its token lets pushes trigger CI), and the secret
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY exists.
#
# Keep this file identical on dev and master. GitHub runs issue-triggered workflows from the
# default branch (master), and the Claude action skips any workflow whose file differs from
# the default branch's copy. The last step fails the run when that happens.
name: Factory · plan

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: factory-plan
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan:
    if: >-
      vars.FACTORY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && github.event.label.name == 'factory:ready') ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'factory/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the issue (oldest ready, WIP allowing, gate opened by a factory actor)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(node scripts/factory/state.mjs --queue | jq -r '.pick // empty')
          if [ -z "$n" ]; then echo "Nothing to plan: WIP limit reached or no factory:ready issue."; exit 0; fi
          next=$(node scripts/factory/state.mjs "$n" | jq -r '.next // empty')
          if [ "$next" != plan ]; then echo "#$n: next is '$next', not plan."; exit 0; fi
          echo "issue=$n" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.pick.outputs.issue
        run: |
          npm ci
          npm ci --prefix apps/zoom-app
          npm ci --prefix apps/web
          npm ci --prefix apps/table-topics
      - uses: anthropics/claude-code-action@v1
        if: steps.pick.outputs.issue
        env:
          FACTORY_STATION: plan
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: /factory-plan ${{ steps.pick.outputs.issue }}
          claude_args: --model claude-opus-5-5 --effort high --max-turns 80 --allowedTools Bash,Read,Edit,Write,MultiEdit,Glob,Grep,Task,Skill
      - name: Check the station ran
        if: steps.pick.outputs.issue
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.pick.outputs.issue }}
        run: |
          next=$(node scripts/factory/state.mjs "$N" | jq -r '.next // empty')
          if [ "$next" = plan ]; then
            echo "::error::#$N still needs plan: the station didn't finish. If the Claude step logged 'Workflow validation failed', this file differs from master's copy."
            exit 1
          fi
