# Deploys ONLY the Table Topics generator Worker when its files change on
# master. The timer Worker is never deployed by CI (see docs/TABLE_TOPICS.md).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — scoped token: Account › Workers Scripts:Edit,
#                            Account › Account Settings:Read, Zone › DNS:Edit
#                            (custom domains) and Zone › Workers Routes:Edit
#                            for the toastmusters.com zone.
#   CLOUDFLARE_ACCOUNT_ID
# Optional repository variables (public keys, safe to expose):
#   VITE_PUBLIC_POSTHOG_KEY, VITE_PUBLIC_POSTHOG_HOST
name: Deploy Table Topics generator

on:
  push:
    branches: [master]
    paths:
      - 'apps/table-topics/**'
      - 'packages/shared/appLinks.js'
      - 'packages/ui/**'
      - '.github/workflows/deploy-tabletopics.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tabletopics
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/table-topics/package-lock.json

      # Root install brings wrangler + vitest; the app install links packages/shared.
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix apps/table-topics

      # --root points vitest at the app's own config. The root config lists every
      # workspace project and fails to load unless apps/web and apps/zoom-app are
      # installed too, which this job deliberately does not do.
      - name: Validate content and run the app's tests
        run: |
          npm run validate:tabletopics
          npx vitest run --root apps/table-topics

      - name: Build
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
        run: npm run build:tabletopics

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c apps/table-topics/wrangler.jsonc

      # The site is served at www.toastmusters.com/tabletopics through the timer
      # Worker's TABLETOPICS binding; the old host only redirects there.
      - name: Smoke test
        run: |
          set -e
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.toastmusters.com/tabletopics/)
          test "$code" = "200" || { echo "home returned $code"; exit 1; }
          curl -sf https://www.toastmusters.com/tabletopics/questions.json | head -c 200 >/dev/null
          location=$(curl -s -o /dev/null -w '%{redirect_url}' https://www.tabletopics.toastmusters.com/topics/)
          test "$location" = "https://www.toastmusters.com/tabletopics/topics/" || { echo "old host redirected to '$location'"; exit 1; }
